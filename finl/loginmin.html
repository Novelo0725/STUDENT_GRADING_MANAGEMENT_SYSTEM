<html>
<head>
    <title>STUDENT GRADING MANAGEMENT SYSTEM</title>
</head>
<style>

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden; 
}

body {
  background-image: url('carousel-2.jpg');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
.bg {
  background-color: rgba(235, 243, 254, 0.5); 
  width: 100vw;
  height: 100vh;
  box-sizing: border-box;
  display: flex;
  justify-content: space-around; 
  align-items: center;                 
  padding: 0 20px;
}
.login-container {
  position: relative;
  background-color: #f0f4f9;
  width: 380px;
  padding: 40px 30px;
  border-radius: 25px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  text-align: center;
  margin-top: 50px; /* Space for the overlapping logo */
}

.logo-wrapper {
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 90px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  border: 3px solid #f0f4f9;
}

.logo-wrapper img {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  object-fit: cover;
}

h2 {
  color: #3b4d66;
  font-size: 28px;
  margin-top: 25px;
  margin-bottom: 30px;
  font-family: serif;
}

.form-group {
   text-align: left;
   margin-bottom: 20px;
}
.form-group label {
  display: block;
  color: #3b4d66;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  background-color: #ffffff;
  font-size: 14px;
  box-sizing: border-box;
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus {
  border-color: #4b6584;
}

.form-group input::placeholder {
  color: #b0b4bc;
}

.login-btn {
  width: 100%;
  padding: 12px;
  background-color: #435b75;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  transition: background-color 0.2s;
}

.login-btn:hover {
  background-color: #33475c;
}

.error-msg {
  color: #e74c3c;
  font-size: 12px;
  margin-top: 10px;
  text-align: left;
  display: none;
}

.forgot-password {
  display: block;
  text-align: left;
  margin-top: 25px;
  color: #3b4d66;
  font-size: 13px;
  text-decoration: underline;
}

.forgot-password:hover {
  color: #1a2530;
}
</style>
<body>
    <div class="bg">
        <div class="login-container">
        <div class="logo-wrapper">
            <img src="FB_IMG_1790923310158 (1).jpg" alt="Logo">
        </div>

        <h2>Welcome!</h2>
        
        <form id="login-form" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label for="employeeId">Employee ID:</label>
                <input type="text" id="employeeId" placeholder="Enter Employee ID" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>

            <div id="error-message" class="error-msg">Invalid Employee ID or Password.</div>

            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>
    </div>

    <script>
        // Initialize default Admin account in localStorage if it doesn't exist yet
        (function initializeAdminData() {
            if (!localStorage.getItem('adminUser')) {
                const defaultAdmin = {
                    employeeId: "Admin",
                    password: "admin123"
                };
                localStorage.setItem('adminUser', JSON.stringify(defaultAdmin));
            }
        })();

        function handleAdminLogin(event) {
            event.preventDefault(); // Prevent page refresh

            const inputId = document.getElementById('employeeId').value.trim();
            const inputPass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('error-message');

            // Retrieve admin credentials from localStorage
            const storedAdmin = JSON.parse(localStorage.getItem('adminUser'));

            if (storedAdmin && inputId === storedAdmin.employeeId && inputPass === storedAdmin.password) {
                // Successful login
                errorDiv.style.display = 'none';
                
                // Optional: Store active session flag
                localStorage.setItem('isAdminLoggedIn', 'true');

                // Redirect to Admin Dashboard
                window.location.href = 'admindsh.html';
            } else {
                // Failed login
                errorDiv.style.display = 'block';
                document.getElementById('password').value = ''; // Clear password field
            }
        }
    </script>
</body>
</html>
