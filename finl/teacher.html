<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Teacher</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .serif-heading {
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* Custom Exact Color Palette */
    .bg-sidebar {
      background-color: #3b537c;
    }
    .bg-header-blue {
      background-color: #edf2f7;
    }
    .bg-form-box {
      background-color: #dedede;
    }
    .bg-btn-navy {
      background-color: #3c5278;
    }
    .bg-btn-navy:hover {
      background-color: #2b3d5b;
    }

    /* Action Buttons Exact Colors */
    .btn-edit {
      background-color: #3789fa;
    }
    .btn-edit:hover {
      background-color: #256edc;
    }
    .btn-password {
      background-color: #d9c022;
    }
    .btn-password:hover {
      background-color: #bfa81b;
    }
    .btn-delete {
      background-color: #f04848;
    }
    .btn-delete:hover {
      background-color: #d83434;
    }
    /* Custom Sidebar Styles */
    .sidebar a {
        width: 100%;
        text-decoration: none;
        display: flex;
        justify-content: center;
    }
    .sidebar {
        width: 70px;
        background-color: #3b4d66;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 100px; 
        gap: 50px;
        flex-shrink: 0;
        z-index: 20;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .sidebar-icon {
        width: 100%;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #a4b0be;
        cursor: pointer;
    }
    .sidebar-icon.active, .sidebar-icon:hover, .sidebar a:hover .sidebar-icon {
        color: #ffffff;
        background-color: rgba(255, 255, 255, 0.1);
    }
    .sidebar-icon.logout {
        margin-top: auto;
        margin-bottom: 20px;
    }
    .sidebar-icon img {
        width: 40px;
        height: 40px;
        object-fit: contain;
    }

    /* Logout Modal Custom Styling */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background: #ffffff;
        padding: 25px 30px;
        border-radius: 12px;
        text-align: center;
        width: 320px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .modal-content h3 {
        color: #3b4d66;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
    }
    .modal-content p {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 20px;
    }
    .modal-actions {
        display: flex;
        gap: 10px;
    }
    .modal-btn {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        border: none;
    }
    .btn-cancel {
        background: #f1f5f9;
        color: #475569;
    }
    .btn-cancel:hover {
        background: #e2e8f0;
    }
    .btn-confirm {
        background: #3b4d66;
        color: #ffffff;
    }
    .btn-confirm:hover {
        background: #2c3a4e;
    }
  </style>
</head>
<body class="h-screen w-screen bg-white flex overflow-hidden">

  <!-- LEFT NAVIGATION SIDEBAR -->
  <div class="sidebar">
    <a href="admindsh.html">
      <div class="sidebar-icon">
        <img src="Untitled1_20261017225057.png" alt="Home">
      </div>
    </a>
    <a href="STUDENT.html">
      <div class="sidebar-icon">
        <img src="Untitled5_20261019223757.png" alt="Students">
      </div>
    </a>
    <a href="teacher.html">
      <div class="sidebar-icon active">
        <img src="Untitled5_20261019223806.png" alt="Teachers">
      </div>
    </a>
    <a href="grdemanage.html">
      <div class="sidebar-icon">
        <img src="Untitled1_20261017225103.png" alt="Grades">
      </div>
    </a>
    <!-- Logout Button with id="logout-btn" -->
    <div class="sidebar-icon logout" id="logout-btn" title="Logout">
      <img src="Untitled1_20261017225136.png" alt="Logout">
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 flex flex-col h-full overflow-y-auto bg-white">

    <!-- TOP HEADER / BANNER -->
    <header class="bg-header-blue px-8 pt-8 pb-6 border-b border-slate-300/60 flex-shrink-0 shadow-xs">
      <h1 class="serif-heading text-3xl md:text-4xl text-[#3b537c] font-bold tracking-wide uppercase">
        MANAGE TEACHER
      </h1>
    </header>

    <!-- PAGE BODY CONTENT -->
    <div class="p-6 md:p-8 space-y-8 max-w-7xl w-full mx-auto bg-white">

      <!-- ADD TEACHER FORM CARD -->
      <section class="bg-form-box border border-slate-400/80 rounded-sm p-6 shadow-xs">
        <h2 class="serif-heading text-xl md:text-2xl text-[#3b537c] font-bold tracking-wide uppercase mb-4">
          ADD TEACHER
        </h2>

        <form id="add-teacher-form" onsubmit="handleAddTeacher(event)" class="space-y-3">

          <!-- ROW 1: FIRST NAME, LAST NAME -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input 
              type="text" 
              id="firstName" 
              placeholder="FIRST NAME" 
              required
              class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
            >
            <input 
              type="text" 
              id="lastName" 
              placeholder="LAST NAME" 
              required
              class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
            >
          </div>

          <!-- ROW 2: EMPLOYEE ID, SEX, EMAIL -->
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-12 gap-3">
            <div class="md:col-span-4">
              <input 
                type="text" 
                id="employeeId" 
                placeholder="EMPLOYEE ID" 
                required
                class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
              >
            </div>
            <div class="md:col-span-3">
              <input 
                type="text" 
                id="sex" 
                placeholder="SEX" 
                class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
              >
            </div>
            <div class="md:col-span-5">
              <input 
                type="email" 
                id="email" 
                placeholder="EMAIL" 
                required
                class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
              >
            </div>
          </div>

          <!-- ROW 3: DATE OF BIRTH, CONTACT NO., DEPARTMENT -->
          <div class="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-12 gap-3">
            <div class="md:col-span-4">
              <input 
                type="text" 
                id="dob" 
                placeholder="DATE OF BIRTH (MM/DD/YYYY)" 
                class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
              >
            </div>
            <div class="md:col-span-4">
              <input 
                type="text" 
                id="contact" 
                placeholder="CONTACT NO." 
                class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
              >
            </div>
            <div class="md:col-span-4">
              <input 
                type="text" 
                id="department" 
                placeholder="DEPARTMENT" 
                required
                class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
              >
            </div>
          </div>

          <!-- ROW 4: PASSWORD & ADD USER BUTTON -->
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 pt-1">
            <div class="md:col-span-9">
              <input 
                type="password" 
                id="password" 
                placeholder="PASSWORD" 
                required
                class="w-full bg-white border border-slate-300 rounded px-3 py-2 text-xs text-slate-700 placeholder-slate-400 uppercase focus:outline-none focus:ring-1 focus:ring-[#3b537c]"
              >
            </div>
            <div class="md:col-span-3">
              <button 
                type="submit" 
                class="w-full bg-btn-navy text-white font-bold text-xs py-2 px-4 rounded uppercase tracking-wider transition-colors shadow-xs flex items-center justify-center gap-1.5"
              >
                ADD USER
              </button>
            </div>
          </div>

        </form>
      </section>

      <!-- TEACHER TABLE -->
      <section class="overflow-x-auto border border-slate-200 rounded-sm">
        <table class="w-full text-left border-collapse min-w-[700px]">
          <thead>
            <tr class="bg-header-blue text-[#3b537c] font-semibold text-sm border-b border-slate-300">
              <th class="py-3 px-4 w-1/5 text-center border-r border-slate-200/80">Employee ID</th>
              <th class="py-3 px-4 w-1/5 text-center border-r border-slate-200/80">Name</th>
              <th class="py-3 px-4 w-1/4 text-center border-r border-slate-200/80">Email</th>
              <th class="py-3 px-4 w-1/6 text-center border-r border-slate-200/80">Department</th>
              <th class="py-3 px-4 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="teacher-table-body" class="text-xs text-slate-700 divide-y divide-slate-200">
            <!-- Dynamically populated from LocalStorage -->
          </tbody>
        </table>
      </section>

    </div>
  </main>

  <!-- PASSWORD RESET MODAL -->
  <div id="password-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6 border border-slate-200">
      <h3 class="text-base font-bold text-[#3b537c] mb-1">Reset Password</h3>
      <p class="text-xs text-slate-500 mb-4" id="password-modal-teacher-name">Teacher: -</p>

      <div class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">New Password</label>
          <input type="password" id="new-password-input" class="w-full border border-slate-300 rounded px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-[#3b537c]">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 mt-6">
        <button onclick="closePasswordModal()" class="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded">Cancel</button>
        <button onclick="saveNewPassword()" class="px-3 py-1.5 text-xs font-semibold bg-[#3c5278] hover:bg-[#2e4162] text-white rounded">Update Password</button>
      </div>
    </div>
  </div>

  <!-- EDIT TEACHER MODAL -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 border border-slate-200">
      <h3 class="text-base font-bold text-[#3b537c] mb-4">Edit Teacher Details</h3>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-600 uppercase mb-1">Employee ID</label>
          <input type="text" id="edit-emp-id" class="w-full border border-slate-300 rounded px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#3b537c]">
        </div>
        <div>
          <label class="block font-bold text-slate-600 uppercase mb-1">Teacher Name</label>
          <input type="text" id="edit-name" class="w-full border border-slate-300 rounded px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#3b537c]">
        </div>
        <div>
          <label class="block font-bold text-slate-600 uppercase mb-1">Email</label>
          <input type="email" id="edit-email" class="w-full border border-slate-300 rounded px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#3b537c]">
        </div>
        <div>
          <label class="block font-bold text-slate-600 uppercase mb-1">Department</label>
          <input type="text" id="edit-dept" class="w-full border border-slate-300 rounded px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-[#3b537c]">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 mt-6">
        <button onclick="closeEditModal()" class="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded">Cancel</button>
        <button onclick="saveTeacherEdit()" class="px-3 py-1.5 text-xs font-semibold bg-[#3c5278] hover:bg-[#2e4162] text-white rounded">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- LOGOUT CONFIRMATION MODAL -->
  <div class="modal-overlay" id="logoutModal">
      <div class="modal-content">
          <h3>Ready to Leave?</h3>
          <p>Are you sure you want to log out of your session?</p>
          <div class="modal-actions">
              <button class="modal-btn btn-cancel" id="cancelLogout">Cancel</button>
              <button class="modal-btn btn-confirm" id="confirmLogout">Log Out</button>
          </div>
      </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-3 rounded-lg shadow-xl opacity-0 translate-y-4 pointer-events-none z-50 transition-all duration-300">
    <span id="toast-message">Action completed successfully</span>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    let currentRowIndexToEdit = null;

    // Default mock teachers if local storage is empty
    const defaultTeachers = [
      { employeeId: "008762357", name: "Jane", email: "Jane@edu.ph", department: "English" },
      { employeeId: "008762357", name: "Jane", email: "Jane@edu.ph", department: "English" },
      { employeeId: "008762357", name: "Jane", email: "Jane@edu.ph", department: "English" }
    ];

    // Load records on page start
    document.addEventListener("DOMContentLoaded", () => {
      loadTeachers();
    });

    function getStoredTeachers() {
      const data = localStorage.getItem('managed_teachers');
      if (!data) {
        localStorage.setItem('managed_teachers', JSON.stringify(defaultTeachers));
        return defaultTeachers;
      }
      return JSON.parse(data);
    }

    function saveStoredTeachers(teachers) {
      localStorage.setItem('managed_teachers', JSON.stringify(teachers));
    }

    function loadTeachers() {
      const teachers = getStoredTeachers();
      const tbody = document.getElementById('teacher-table-body');
      tbody.innerHTML = '';

      teachers.forEach((teacher, index) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition-colors";

        tr.innerHTML = `
          <td class="py-3 px-4 text-center font-normal text-slate-700 border-r border-slate-200/80 emp-id">${teacher.employeeId}</td>
          <td class="py-3 px-4 text-center font-normal text-slate-700 border-r border-slate-200/80 emp-name">${teacher.name}</td>
          <td class="py-3 px-4 text-center font-normal text-slate-700 border-r border-slate-200/80 emp-email">${teacher.email}</td>
          <td class="py-3 px-4 text-center font-normal text-slate-700 border-r border-slate-200/80 emp-dept">${teacher.department}</td>
          <td class="py-3 px-4 text-center">
            <div class="flex items-center justify-center gap-1.5">
              <button onclick="openEditModal(${index})" class="btn-edit text-white px-3 py-1 rounded text-[11px] font-medium flex items-center gap-1 shadow-xs transition-colors">
                <i data-lucide="pencil" class="w-3 h-3"></i> Edit
              </button>
              <button onclick="openPasswordModal('${teacher.name}')" class="btn-password text-white px-3 py-1 rounded text-[11px] font-medium flex items-center gap-1 shadow-xs transition-colors">
                <i data-lucide="key" class="w-3 h-3"></i> Password
              </button>
              <button onclick="deleteTeacher(${index})" class="btn-delete text-white px-3 py-1 rounded text-[11px] font-medium flex items-center gap-1 shadow-xs transition-colors">
                <i data-lucide="trash-2" class="w-3 h-3"></i> Delete
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      lucide.createIcons();
    }

    // Handle Form Submit to Add Teacher and Save to LocalStorage
    function handleAddTeacher(e) {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const employeeId = document.getElementById('employeeId').value.trim();
      const email = document.getElementById('email').value.trim();
      const department = document.getElementById('department').value.trim();

      const fullName = firstName ? `${firstName}` : lastName;

      let teachers = getStoredTeachers();
      teachers.push({ employeeId, name: fullName, email, department });
      saveStoredTeachers(teachers);

      loadTeachers();

      // Reset Form Fields
      document.getElementById('add-teacher-form').reset();
      showToast(`Teacher ${fullName} added successfully!`);
    }

    // Delete Teacher Row from LocalStorage & View
    function deleteTeacher(index) {
      let teachers = getStoredTeachers();
      const removedTeacher = teachers.splice(index, 1)[0];
      saveStoredTeachers(teachers);
      loadTeachers();

      showToast(`Teacher ${removedTeacher ? removedTeacher.name : ''} deleted.`);
    }

    // Password Modal Logic
    function openPasswordModal(teacherName) {
      document.getElementById('password-modal-teacher-name').textContent = `Teacher: ${teacherName}`;
      document.getElementById('new-password-input').value = '';
      document.getElementById('password-modal').classList.remove('hidden');
    }

    function closePasswordModal() {
      document.getElementById('password-modal').classList.add('hidden');
    }

    function saveNewPassword() {
      const pass = document.getElementById('new-password-input').value;
      if (!pass) {
        showToast("Please enter a password");
        return;
      }
      closePasswordModal();
      showToast("Password updated successfully!");
    }

    // Edit Teacher Modal Logic
    function openEditModal(index) {
      currentRowIndexToEdit = index;
      let teachers = getStoredTeachers();
      const teacher = teachers[index];

      document.getElementById('edit-emp-id').value = teacher.employeeId;
      document.getElementById('edit-name').value = teacher.name;
      document.getElementById('edit-email').value = teacher.email;
      document.getElementById('edit-dept').value = teacher.department;

      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
      currentRowIndexToEdit = null;
    }

    function saveTeacherEdit() {
      if (currentRowIndexToEdit === null) return;

      let teachers = getStoredTeachers();
      teachers[currentRowIndexToEdit].employeeId = document.getElementById('edit-emp-id').value;
      teachers[currentRowIndexToEdit].name = document.getElementById('edit-name').value;
      teachers[currentRowIndexToEdit].email = document.getElementById('edit-email').value;
      teachers[currentRowIndexToEdit].department = document.getElementById('edit-dept').value;

      saveStoredTeachers(teachers);
      loadTeachers();
      closeEditModal();
      showToast("Teacher details updated successfully!");
    }

    // Logout Confirmation Modal Logic
    const logoutBtn = document.getElementById('logout-btn');
    const logoutModal = document.getElementById('logoutModal');
    const cancelLogout = document.getElementById('cancelLogout');
    const confirmLogout = document.getElementById('confirmLogout');

    logoutBtn.addEventListener('click', function() {
        logoutModal.style.display = 'flex';
    });

    cancelLogout.addEventListener('click', function() {
        logoutModal.style.display = 'none';
    });

    confirmLogout.addEventListener('click', function() {
        window.location.href = 'dsh.html'; // Change to your login or index page if needed
    });

    window.addEventListener('click', function(event) {
        if (event.target === logoutModal) {
            logoutModal.style.display = 'none';
        }
    });

    // Toast Notification helper
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;

      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
      }, 3000);
    }
  </script>
</body>
</html>
