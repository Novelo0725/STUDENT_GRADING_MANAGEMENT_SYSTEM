<html>
<head>
    <title>STUDENT GRADING MANAGEMENT SYSTEM</title>
</head>
<style>

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden; 
}

body {
  background-image: url('carousel-2.jpg');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
.bg {
  background-color: rgba(235, 243, 254, 0.5); 
  width: 100vw;
  height: 100vh;
  box-sizing: border-box;
  display: flex;
  justify-content: space-around; 
  align-items: center;                   
  padding: 0 20px;
}
.login-container {
  position: relative;
  background-color: #f0f4f9;
  width: 380px;
  padding: 40px 30px;
  border-radius: 25px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  text-align: center;
  margin-top: 50px; /* Space for the overlapping logo */
}

.logo-wrapper {
  position: absolute;
  top: -50px;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 90px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  border: 3px solid #f0f4f9;
}

.logo-wrapper img {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  object-fit: cover;
}

h2{
  color: #3B557E;
  font-size: 28px;
  margin-top: 25px;
  margin-bottom: 30px;
  font-family: serif;
}
h3{
  color: #3B557E;
  font-size: 15px;
  margin-top: 25px;
  margin-bottom: 30px;
  font-family: serif;
}

.form-group {
   text-align: left;
   margin-bottom: 20px;
}
.form-group label {
  display: block;
  color: #3b4d66;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid #dcdfe6;
  border-radius: 8px;
  background-color: #ffffff;
  font-size: 14px;
  box-sizing: border-box;
  outline: none;
  transition: border-color 0.2s;
  text-align: center;
}

.form-group input:focus {
  border-color: #4b6584;
}

.form-group input::placeholder {
  color: #b0b4bc;
}

.login-btn {
  width: 100%;
  padding: 12px;
  background-color: #435b75;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  transition: background-color 0.2s;
}

.login-btn:hover {
  background-color: #33475c;
}


</style>
<body>
    <div class="bg">
        <div class="login-container">
        <div class="logo-wrapper">
            <img src="FB_IMG_1790923310158 (1).jpg" >
        </div>

        <h2>Enter One-Time Pin</h2>
        <h3>OTP will expire in one  hour</h3>

        <form>
            <div class="form-group">
                <input type="text" id="lrn" placeholder="000000">
            </div>
            <button type="button" class="login-btn" onclick="window.location.href='enternewpsswordmin.html';">Submit</button>
        </form>

    </div>
        </div>
    </div>
</body>
</html>
